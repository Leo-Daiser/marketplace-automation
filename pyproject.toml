[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqbiq-marketplace-automation-portfolio"
version = "0.1.0"
description = "Three portfolio automation cases for marketplace ads, reviews, and competitor SEO monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Portfolio Project" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
sheets = ["google-auth>=2.29", "requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
marketplace-automation = "marketplace_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
