name: CI

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run preflight
        shell: pwsh
        run: .\scripts\preflight.ps1
